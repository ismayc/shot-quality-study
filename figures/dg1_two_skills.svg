<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 534.2" role="img" aria-label="How a shot is priced, and how Jokic and Gobert split into selection and making"><title>How a shot is priced, and how Jokic and Gobert split into selection and making</title><defs><marker id="dg-arrow-bc2a13a45b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="20" y="26" font-size="16" class="dg-f-ink dg-text" font-weight="600">1. Every shot gets a price</text><rect x="20" y="44" width="220" height="94" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="32" y="66" font-size="14" class="dg-f-ink dg-text" font-weight="600">The shot</text><text x="32" y="86" font-size="14" class="dg-f-ink2 dg-text">where it was taken,</text><text x="32" y="104.2" font-size="14" class="dg-f-ink2 dg-text">distance, angle, and</text><text x="32" y="122.4" font-size="14" class="dg-f-ink2 dg-text">action family</text><line x1="244" y1="91" x2="266" y2="91" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-bc2a13a45b)"/><rect x="270" y="44" width="220" height="94" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="282" y="66" font-size="14" class="dg-f-ink dg-text" font-weight="600">The model</text><text x="282" y="86" font-size="14" class="dg-f-ink2 dg-text">the chance a shot like it</text><text x="282" y="104.2" font-size="14" class="dg-f-ink2 dg-text">goes in (xMake)</text><line x1="494" y1="91" x2="516" y2="91" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-bc2a13a45b)"/><rect x="520" y="44" width="220" height="94" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="532" y="66" font-size="14" class="dg-f-ink dg-text" font-weight="600">The price</text><text x="532" y="86" font-size="14" class="dg-f-ink2 dg-text">xMake times 2 or 3:</text><text x="532" y="104.2" font-size="14" class="dg-f-ink2 dg-text">expected points</text><text x="20" y="168" font-size="14" class="dg-f-ink2 dg-text">Dearest shot type: dunk, 1.78 expected points. Cheapest: long two, 16+ ft, 0.82.</text><text x="20" y="212" font-size="16" class="dg-f-ink dg-text" font-weight="600">2. Add up a player&#x27;s shots</text><text x="20" y="236" font-size="14" class="dg-f-ink3 dg-text">Points per shot, against the league average. Selection: the price of the shots he takes.</text><text x="20" y="254.2" font-size="14" class="dg-f-ink3 dg-text">Making: what he scores above that price.</text><text x="20" y="318.2" font-size="14" class="dg-f-ink dg-text" font-weight="600">Nikola Jokic</text><text x="20" y="336.2" font-size="14" class="dg-f-ink3 dg-text">1,411 shots</text><rect x="242.905" y="306.2" width="74.0805" height="14" class="dg-f-nba" rx="2"/><rect x="242.905" y="324.2" width="233.107" height="14" class="dg-f-c3" rx="2"/><circle cx="476.012" cy="331.2" r="4" class="dg-f-ink"/><line x1="316.985" y1="301.2" x2="316.985" y2="343.2" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="236.905" y="318.2" font-size="14" class="dg-f-nba dg-text" text-anchor="end" font-weight="600">selection -6.1</text><text x="486.012" y="336.2" font-size="14" class="dg-f-c3 dg-text" font-weight="600">making +19.2</text><text x="20" y="392.2" font-size="14" class="dg-f-ink dg-text" font-weight="600">Rudy Gobert</text><text x="20" y="410.2" font-size="14" class="dg-f-ink3 dg-text">614 shots</text><rect x="316.985" y="380.2" width="350.11" height="14" class="dg-f-nba" rx="2"/><rect x="595.722" y="398.2" width="71.3732" height="14" class="dg-f-c8" rx="2"/><circle cx="595.722" cy="405.2" r="4" class="dg-f-ink"/><line x1="316.985" y1="375.2" x2="316.985" y2="417.2" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="310.985" y="392.2" font-size="14" class="dg-f-nba dg-text" text-anchor="end" font-weight="600">selection +28.8</text><text x="589.722" y="410.2" font-size="14" class="dg-f-c8 dg-text" text-anchor="end" font-weight="600">making -5.9</text><text x="316.985" y="286.2" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">league average 1.093</text><line x1="170" y1="448.2" x2="740" y2="448.2" stroke-width="1" class="dg-s-rule"/><line x1="203.89" y1="448.2" x2="203.89" y2="452.2" stroke-width="1" class="dg-s-rule"/><text x="203.89" y="468.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">1.0</text><line x1="325.397" y1="448.2" x2="325.397" y2="452.2" stroke-width="1" class="dg-s-rule"/><text x="325.397" y="468.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">1.1</text><line x1="446.905" y1="448.2" x2="446.905" y2="452.2" stroke-width="1" class="dg-s-rule"/><text x="446.905" y="468.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">1.2</text><line x1="568.413" y1="448.2" x2="568.413" y2="452.2" stroke-width="1" class="dg-s-rule"/><text x="568.413" y="468.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">1.3</text><line x1="689.92" y1="448.2" x2="689.92" y2="452.2" stroke-width="1" class="dg-s-rule"/><text x="689.92" y="468.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">1.4</text><text x="740" y="488.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">points per shot</text><text x="20" y="520.2" font-size="14" class="dg-f-ink3 dg-text">Both steps in points per 100 shots. The dot is what he scored.</text></svg>
