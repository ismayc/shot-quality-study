<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 805.6" role="img" aria-label="Trust the diet, regress the making: Jokic keeps 85% of his making, Kennard 42%"><title>Trust the diet, regress the making: Jokic keeps 85% of his making, Kennard 42%</title><defs><marker id="dg-arrow-450d96753e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="14" y="26" font-size="14" class="dg-f-ink dg-text" font-weight="600">1. What repeats from 2023-24 to 2024-25</text><rect x="14" y="42" width="332" height="80" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><rect x="14" y="42" width="6" height="80" class="dg-f-nba" rx="2"/><text x="32" y="64" font-size="13" class="dg-f-nba dg-text" font-weight="600">Selection: r = .91</text><text x="32" y="86" font-size="12" class="dg-f-ink2 dg-text">Repeats almost fully: carry it forward whole.</text><rect x="14" y="136" width="332" height="80" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><rect x="14" y="136" width="6" height="80" class="dg-f-c3" rx="2"/><text x="32" y="158" font-size="13" class="dg-f-c3 dg-text" font-weight="600">Making: r = .60</text><text x="32" y="180" font-size="12" class="dg-f-ink2 dg-text">Half repeats: shrink it toward the league</text><text x="32" y="195.6" font-size="12" class="dg-f-ink2 dg-text">mean.</text><text x="14" y="256" font-size="14" class="dg-f-ink dg-text" font-weight="600">2. Shrink each player&#x27;s making by how noisy it is</text><text x="14" y="278" font-size="12" class="dg-f-ink3 dg-text">Share kept = τ² / (τ² + SE²), where τ = 6.7 points</text><text x="14" y="293.6" font-size="12" class="dg-f-ink3 dg-text">per 100 is the league&#x27;s spread of true making and</text><text x="14" y="309.2" font-size="12" class="dg-f-ink3 dg-text">SE is the player&#x27;s own noise. More shots, smaller</text><text x="14" y="324.8" font-size="12" class="dg-f-ink3 dg-text">SE, more of his number kept.</text><text x="14" y="376.8" font-size="12" class="dg-f-ink dg-text" font-weight="600">Nikola Jokic: 1,411 shots, SE 2.8</text><line x1="233.856" y1="420.8" x2="297.961" y2="420.8" stroke-width="2" class="dg-s-ink3"/><circle cx="265.908" cy="420.8" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><line x1="258.908" y1="436.8" x2="240.998" y2="436.8" stroke-width="1.8" class="dg-s-c3 dg-arrowed" marker-end="url(#dg-arrow-450d96753e)"/><circle cx="233.998" cy="420.8" r="5.5" class="dg-f-c3"/><line x1="48.4601" y1="406.8" x2="48.4601" y2="442.8" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="14" y="394.8" font-size="12" class="dg-f-c3 dg-text" font-weight="600">keeps 85%: +19.2 to +16.4</text><text x="14" y="480.8" font-size="12" class="dg-f-ink dg-text" font-weight="600">Luke Kennard: 315 shots, SE 7.8</text><line x1="127.263" y1="524.8" x2="307.54" y2="524.8" stroke-width="2" class="dg-s-ink3"/><circle cx="217.402" cy="524.8" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><line x1="210.402" y1="540.8" x2="127.04" y2="540.8" stroke-width="1.8" class="dg-s-c3 dg-arrowed" marker-end="url(#dg-arrow-450d96753e)"/><circle cx="120.04" cy="524.8" r="5.5" class="dg-f-c3"/><line x1="48.4601" y1="510.8" x2="48.4601" y2="546.8" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="14" y="498.8" font-size="12" class="dg-f-c3 dg-text" font-weight="600">keeps 42%: +15.0 to +6.5</text><line x1="14" y1="554.8" x2="342" y2="554.8" stroke-width="1" class="dg-s-rule"/><line x1="45.5408" y1="554.8" x2="45.5408" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="45.5408" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">0</text><line x1="102.974" y1="554.8" x2="102.974" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="102.974" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">+5</text><line x1="160.408" y1="554.8" x2="160.408" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="160.408" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">+10</text><line x1="217.841" y1="554.8" x2="217.841" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="217.841" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">+15</text><line x1="275.275" y1="554.8" x2="275.275" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="275.275" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">+20</text><line x1="332.709" y1="554.8" x2="332.709" y2="558.8" stroke-width="1" class="dg-s-rule"/><text x="332.709" y="572.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">+25</text><text x="342" y="590.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">making, points above expected per 100 shots</text><circle cx="20" cy="610.8" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><text x="32" y="614.8" font-size="12" class="dg-f-ink3 dg-text">observed, with 1 SE either side</text><circle cx="20" cy="630.8" r="5.5" class="dg-f-c3"/><text x="32" y="634.8" font-size="12" class="dg-f-ink3 dg-text">after shrinking</text><line x1="20" y1="642.8" x2="20" y2="658.8" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="32" y="654.8" font-size="12" class="dg-f-ink3 dg-text">league mean +0.3</text><text x="14" y="698.8" font-size="14" class="dg-f-ink dg-text" font-weight="600">3. Project next season, then check</text><text x="14" y="720.8" font-size="12" class="dg-f-ink2 dg-text">Jokic: diet 1.032 plus shrunk making 0.164</text><text x="14" y="736.4" font-size="12" class="dg-f-ink2 dg-text">projects 1.196 points per shot; he scored 1.254.</text><text x="14" y="758.4" font-size="12" class="dg-f-ink dg-text" font-weight="600">Across all 215 players, the rule&#x27;s average miss is</text><text x="14" y="774" font-size="12" class="dg-f-ink dg-text" font-weight="600">11.4% smaller than carrying raw points per shot</text><text x="14" y="789.6" font-size="12" class="dg-f-ink dg-text" font-weight="600">forward.</text></svg>
