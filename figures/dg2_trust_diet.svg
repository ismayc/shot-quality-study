<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 592.4" role="img" aria-label="Trust the diet, regress the making: Jokic keeps 85% of his making, Kennard 42%"><title>Trust the diet, regress the making: Jokic keeps 85% of his making, Kennard 42%</title><defs><marker id="dg-arrow-88e1419e08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="20" y="26" font-size="16" class="dg-f-ink dg-text" font-weight="600">1. What repeats from 2023-24 to 2024-25</text><rect x="20" y="42" width="350" height="86" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><rect x="20" y="42" width="6" height="86" class="dg-f-nba" rx="2"/><text x="38" y="66" font-size="15" class="dg-f-nba dg-text" font-weight="600">Selection: r = .91</text><text x="38" y="90" font-size="14" class="dg-f-ink2 dg-text">Repeats almost fully: carry it forward</text><text x="38" y="108.2" font-size="14" class="dg-f-ink2 dg-text">whole.</text><rect x="390" y="42" width="350" height="86" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><rect x="390" y="42" width="6" height="86" class="dg-f-c3" rx="2"/><text x="408" y="66" font-size="15" class="dg-f-c3 dg-text" font-weight="600">Making: r = .60</text><text x="408" y="90" font-size="14" class="dg-f-ink2 dg-text">Half repeats: shrink it toward the league</text><text x="408" y="108.2" font-size="14" class="dg-f-ink2 dg-text">mean.</text><text x="20" y="174" font-size="16" class="dg-f-ink dg-text" font-weight="600">2. Shrink each player&#x27;s making by how noisy it is</text><text x="20" y="198" font-size="14" class="dg-f-ink3 dg-text">Share kept = τ² / (τ² + SE²), where τ = 6.7 points per 100 is the league&#x27;s spread of true</text><text x="20" y="216.2" font-size="14" class="dg-f-ink3 dg-text">making and SE is the player&#x27;s own noise. More shots, smaller SE, more of his number kept.</text><text x="20" y="270.2" font-size="14" class="dg-f-ink dg-text" font-weight="600">Nikola Jokic</text><text x="20" y="288.2" font-size="14" class="dg-f-ink3 dg-text">1,411 shots, SE 2.8</text><line x1="551.958" y1="268.2" x2="657.496" y2="268.2" stroke-width="2" class="dg-s-ink3"/><circle cx="604.727" cy="268.2" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><line x1="597.727" y1="284.2" x2="559.192" y2="284.2" stroke-width="1.8" class="dg-s-c3 dg-arrowed" marker-end="url(#dg-arrow-88e1419e08)"/><circle cx="552.192" cy="268.2" r="5.5" class="dg-f-c3"/><line x1="246.733" y1="254.2" x2="246.733" y2="290.2" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="612.727" y="304.2" font-size="14" class="dg-f-c3 dg-text" text-anchor="end" font-weight="600">keeps 85%: +19.2 to +16.4</text><text x="20" y="340.2" font-size="14" class="dg-f-ink dg-text" font-weight="600">Luke Kennard</text><text x="20" y="358.2" font-size="14" class="dg-f-ink3 dg-text">315 shots, SE 7.8</text><line x1="376.47" y1="338.2" x2="673.267" y2="338.2" stroke-width="2" class="dg-s-ink3"/><circle cx="524.868" cy="338.2" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><line x1="517.868" y1="354.2" x2="371.578" y2="354.2" stroke-width="1.8" class="dg-s-c3 dg-arrowed" marker-end="url(#dg-arrow-88e1419e08)"/><circle cx="364.578" cy="338.2" r="5.5" class="dg-f-c3"/><line x1="246.733" y1="324.2" x2="246.733" y2="360.2" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="532.868" y="374.2" font-size="14" class="dg-f-c3 dg-text" text-anchor="end" font-weight="600">keeps 42%: +15.0 to +6.5</text><text x="250.733" y="244.2" font-size="14" class="dg-f-ink2 dg-text">league mean +0.3</text><line x1="190" y1="402.2" x2="730" y2="402.2" stroke-width="1" class="dg-s-rule"/><line x1="241.927" y1="402.2" x2="241.927" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="241.927" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">0</text><line x1="336.482" y1="402.2" x2="336.482" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="336.482" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">+5</text><line x1="431.037" y1="402.2" x2="431.037" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="431.037" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">+10</text><line x1="525.593" y1="402.2" x2="525.593" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="525.593" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">+15</text><line x1="620.148" y1="402.2" x2="620.148" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="620.148" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">+20</text><line x1="714.703" y1="402.2" x2="714.703" y2="406.2" stroke-width="1" class="dg-s-rule"/><text x="714.703" y="422.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">+25</text><text x="730" y="442.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">making, points above expected per 100 shots</text><circle cx="26" cy="460.2" r="5.5" class="dg-f-none dg-s-c3" stroke-width="2"/><text x="38" y="464.2" font-size="14" class="dg-f-ink3 dg-text">observed, with 1 SE either side</text><circle cx="320" cy="460.2" r="5.5" class="dg-f-c3"/><text x="332" y="464.2" font-size="14" class="dg-f-ink3 dg-text">after shrinking</text><text x="20" y="510.2" font-size="16" class="dg-f-ink dg-text" font-weight="600">3. Project next season, then check</text><text x="20" y="534.2" font-size="14" class="dg-f-ink2 dg-text">Jokic: diet 1.032 plus shrunk making 0.164 projects 1.196 points per shot; he scored 1.254.</text><text x="20" y="558.2" font-size="14" class="dg-f-ink dg-text" font-weight="600">Across all 215 players, the rule&#x27;s average miss is 11.4% smaller than carrying raw points per</text><text x="20" y="576.4" font-size="14" class="dg-f-ink dg-text" font-weight="600">shot forward.</text></svg>
