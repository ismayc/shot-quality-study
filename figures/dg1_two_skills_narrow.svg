<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 716.4" role="img" aria-label="How a shot is priced, and how Jokic and Gobert split into selection and making"><title>How a shot is priced, and how Jokic and Gobert split into selection and making</title><defs><marker id="dg-arrow-a217407e50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="14" y="26" font-size="14" class="dg-f-ink dg-text" font-weight="600">1. Every shot gets a price</text><rect x="14" y="42" width="332" height="62" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="26" y="62" font-size="12" class="dg-f-ink dg-text" font-weight="600">The shot</text><text x="26" y="80" font-size="12" class="dg-f-ink2 dg-text">where it was taken, distance, angle, and</text><text x="26" y="95.6" font-size="12" class="dg-f-ink2 dg-text">action family</text><line x1="180" y1="107" x2="180" y2="123" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a217407e50)"/><rect x="14" y="126" width="332" height="62" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="26" y="146" font-size="12" class="dg-f-ink dg-text" font-weight="600">The model</text><text x="26" y="164" font-size="12" class="dg-f-ink2 dg-text">the chance a shot like it goes in (xMake)</text><line x1="180" y1="191" x2="180" y2="207" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a217407e50)"/><rect x="14" y="210" width="332" height="62" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1"/><text x="26" y="230" font-size="12" class="dg-f-ink dg-text" font-weight="600">The price</text><text x="26" y="248" font-size="12" class="dg-f-ink2 dg-text">xMake times 2 or 3: expected points</text><text x="14" y="300" font-size="12" class="dg-f-ink2 dg-text">Dearest shot type: dunk, 1.78 expected points.</text><text x="14" y="315.6" font-size="12" class="dg-f-ink2 dg-text">Cheapest: long two, 16+ ft, 0.82.</text><text x="14" y="355.6" font-size="14" class="dg-f-ink dg-text" font-weight="600">2. Add up a player&#x27;s shots</text><text x="14" y="377.6" font-size="12" class="dg-f-ink3 dg-text">Points per shot, against the league average.</text><text x="14" y="393.2" font-size="12" class="dg-f-ink3 dg-text">Selection: the price of the shots he takes.</text><text x="14" y="408.8" font-size="12" class="dg-f-ink3 dg-text">Making: what he scores above that price.</text><text x="14" y="460.8" font-size="12" class="dg-f-ink dg-text" font-weight="600">Nikola Jokic, 1,411 shots</text><rect x="56.4637" y="472.8" width="43.1487" height="14" class="dg-f-nba" rx="2"/><rect x="56.4637" y="490.8" width="135.775" height="14" class="dg-f-c3" rx="2"/><circle cx="192.238" cy="497.8" r="4" class="dg-f-ink"/><line x1="99.6124" y1="467.8" x2="99.6124" y2="509.8" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="14" y="522.8" font-size="12" class="dg-f-nba dg-text" font-weight="600">selection -6.1,</text><text x="119.44" y="522.8" font-size="12" class="dg-f-c3 dg-text" font-weight="600">making +19.2</text><text x="14" y="552.8" font-size="12" class="dg-f-ink dg-text" font-weight="600">Rudy Gobert, 614 shots</text><rect x="99.6124" y="564.8" width="203.924" height="14" class="dg-f-nba" rx="2"/><rect x="261.965" y="582.8" width="41.5718" height="14" class="dg-f-c8" rx="2"/><circle cx="261.965" cy="589.8" r="4" class="dg-f-ink"/><line x1="99.6124" y1="559.8" x2="99.6124" y2="601.8" stroke-width="1.4" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="14" y="614.8" font-size="12" class="dg-f-nba dg-text" font-weight="600">selection +28.8,</text><text x="126.4" y="614.8" font-size="12" class="dg-f-c8 dg-text" font-weight="600">making -5.9</text><text x="95.6124" y="436.8" font-size="12" class="dg-f-ink2 dg-text">league average 1.093</text><line x1="14" y1="618.8" x2="346" y2="618.8" stroke-width="1" class="dg-s-rule"/><line x1="33.7392" y1="618.8" x2="33.7392" y2="622.8" stroke-width="1" class="dg-s-rule"/><text x="33.7392" y="636.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">1.0</text><line x1="104.512" y1="618.8" x2="104.512" y2="622.8" stroke-width="1" class="dg-s-rule"/><text x="104.512" y="636.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">1.1</text><line x1="175.285" y1="618.8" x2="175.285" y2="622.8" stroke-width="1" class="dg-s-rule"/><text x="175.285" y="636.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">1.2</text><line x1="246.058" y1="618.8" x2="246.058" y2="622.8" stroke-width="1" class="dg-s-rule"/><text x="246.058" y="636.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">1.3</text><line x1="316.831" y1="618.8" x2="316.831" y2="622.8" stroke-width="1" class="dg-s-rule"/><text x="316.831" y="636.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">1.4</text><text x="346" y="654.8" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">points per shot</text><text x="14" y="686.8" font-size="12" class="dg-f-ink3 dg-text">Both steps in points per 100 shots. The dot is</text><text x="14" y="702.4" font-size="12" class="dg-f-ink3 dg-text">what he scored.</text></svg>
